name: MCP

on:
  push:
    paths:
      - 'mcp/**'
      - 'src/**'
      - '.github/workflows/mcp.yml'
  pull_request:
    paths:
      - 'mcp/**'
      - 'src/**'
      - '.github/workflows/mcp.yml'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: mcp
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22.14.0
          cache: npm
          cache-dependency-path: mcp/package-lock.json

      - run: npm ci

      - run: npm run typecheck

      - run: npm test

      - run: npm run build

      - name: Ensure the bundle does not import vscode
        run: |
          if grep -Eq "from ['\"]vscode" dist/index.js; then
            echo "::error::mcp/dist/index.js imports vscode; the MCP bundle must stay extension-free."
            exit 1
          fi

      - name: Smoke-test the CLI
        run: node dist/index.js --once --provider deepseek

name: Pricing calendar

on:
  schedule:
    # 01:00 UTC on the 1st, while there is still a month of lead time before
    # the release gate's hard 30-day stop.
    - cron: '0 1 1 * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      # The job opens or comments on the maintenance issue, so it needs the
      # write scope. A workflow-level `write` would grant it to every job.
      issues: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: 22.14.0

      - name: Check the DeepSeek pricing calendar
        id: calendar
        run: node scripts/check-calendar.mjs
        continue-on-error: true

      - name: Open or update the maintenance issue
        if: steps.calendar.outcome == 'failure'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          days=$(node -p "Math.floor((Date.parse(require('./src/providers/deepseek/pricing-calendar.json').coverageEnd)-Date.now())/86400000)")
          end=$(node -p "require('./src/providers/deepseek/pricing-calendar.json').coverageEnd")
          {
            echo "The DeepSeek pricing calendar covers only **${days}** more days (coverageEnd: \`${end}\`)."
            echo
            echo "Extend \`coverageEnd\` and add the next year's official holidays in"
            echo "\`src/providers/deepseek/pricing-calendar.json\`, update the README coverage note,"
            echo "then run \`npm run package\`. The release gate fails when fewer than 30 days remain."
          } > /tmp/calendar-body.md
          existing=$(gh issue list --state open --search "DeepSeek pricing calendar in:title" --json number --jq '.[0].number')
          if [ -n "$existing" ]; then
            gh issue comment "$existing" --body-file /tmp/calendar-body.md
          else
            gh issue create --title "DeepSeek pricing calendar expires in ${days} days" --body-file /tmp/calendar-body.md
          fi

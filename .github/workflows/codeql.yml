# CodeQL analysis.
#
# Code scanning is free for public repositories on GitHub.com -- no GitHub
# Advanced Security license required.
#
# Two TypeScript roots live in this repository: the VS Code extension under
# src/ and the MCP server under mcp/. CodeQL is pointed at both explicitly
# rather than at the repository root, so a source tree that moves does not
# silently turn into "scanned nothing".
#
# The scheduled run exists so that newly published CodeQL queries are applied
# to code that has not changed since the last push.

name: CodeQL

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # Off-peak minute on purpose: many repos share the top-of-hour crons.
    - cron: "23 4 * * 1"

permissions:
  contents: read
  actions: read
  packages: read
  security-events: write

jobs:
  analyze:
    name: Analyze
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - language: javascript-typescript
            paths: src
          - language: javascript-typescript
            paths: mcp/src
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4
        with:
          languages: ${{ matrix.language }}
          paths: ${{ matrix.paths }}
          queries: security-and-quality

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4
        with:
          category: "/language:${{ matrix.language }}:${{ matrix.paths }}"

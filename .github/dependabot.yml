version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # The extension runs in VS Code 1.101's Electron Node (22.14). Types for a
      # newer Node would compile calls to APIs that do not exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # minimatch is patched by the npm "overrides" block in package.json, which
      # pins it to ^11.0.1 (resolved: 11.0.9) instead of the ^10.2.6 that
      # @vscode/vsce asks for. Dependabot's npm updater cannot see that nested
      # override, so every security-update run it attempts errors out with
      # "the available update path would downgrade @vscode/vsce from 4.1.1 to
      # 3.9.1" and leaves a red run on the repo. Ignoring the dependency stops
      # those runs; `npm audit` in CI still covers minimatch.
      - dependency-name: "minimatch"
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # Same Node 22.14 runtime and type floor as the root package.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"

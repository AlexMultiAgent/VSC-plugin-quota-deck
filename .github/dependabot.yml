version: 2
updates:
  - package-ecosystem: npm
    directory: "/"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # The extension runs in VS Code 1.95's Electron Node (20). Types for a
      # newer Node would compile calls to APIs that do not exist at runtime.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      # TypeScript 7 only exposes `version` from its main entry; the compiler API
      # now lives under `typescript/unstable/*`. scripts/check-ui-localization.mjs
      # still parses sources through the TypeScript 5 API.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
      # Vitest 5 requires Node ^22.12 and @types/node ^22, above this package's
      # Node 20 runtime floor.
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: npm
    directory: "/mcp"
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Shanghai
    open-pull-requests-limit: 5
    ignore:
      # Same Node-20 runtime and type floor as the root package.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: "vitest"
        update-types: ["version-update:semver-major"]
    commit-message:
      prefix: "chore(deps)"
    groups:
      dev-minor-patch:
        dependency-type: development
        update-types: ["minor", "patch"]

  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: monthly
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(ci)"
